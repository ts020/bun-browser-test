name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BWT_BROWSERS_PATH: ${{ github.workspace }}/.cache/bun-webview-test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Build type declarations
        run: bun run build
      - name: Lint package (publint, are-the-types-wrong)
        run: bun run lint:package
      # Ubuntu 24.04 は非特権のユーザー名前空間を AppArmor で制限していて、Chrome のサンドボックスが起動できない
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Chrome Headless Shell
        run: bun src/cli.ts install
      - name: Test (Headless Shell default)
        run: bun test

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BWT_BACKEND: firefox
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - name: Use the installed Firefox
        run: echo "BWT_FIREFOX_PATH=${{ steps.firefox.outputs.firefox-path }}" >> "$GITHUB_ENV"
      - name: Test Vitest-compatible API (Firefox, four workers)
        run: bun test --parallel=4 --no-isolate ./test/browser ./test/vitest
      - name: Test Firefox with Bun isolation
        run: bun test ./test/vitest
